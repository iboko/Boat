name: C++ build and tests
on:
  push:
  pull_request:

jobs:
  native:
    name: Native C++ and INS tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Tests
        run: ctest --test-dir build --output-on-failure
      - name: Run synthetic 2D mission
        run: ./build/boat_sim > /tmp/boat_trajectory.csv && test $(wc -l < /tmp/boat_trajectory.csv) -gt 200
      - name: Run synthetic 3D INS GNSS-denial experiment
        run: ./build/boat_ins_demo > /tmp/boat_ins_trajectory.csv && test $(wc -l < /tmp/boat_ins_trajectory.csv) -gt 190
      - name: Save simulation trajectories
        uses: actions/upload-artifact@v4
        with:
          name: boat-navigation-trajectories
          path: |
            /tmp/boat_trajectory.csv
            /tmp/boat_ins_trajectory.csv
          retention-days: 30

  mavlink:
    name: MAVLink2 encoder compatibility
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Checkout MAVLink C headers
        uses: actions/checkout@v4
        with:
          repository: mavlink/c_library_v2
          path: mavlink_headers
          persist-credentials: false
      - name: Configure MAVLink build
        run: cmake -S . -B build-mavlink -DCMAKE_BUILD_TYPE=Release -DBOAT_WITH_MAVLINK=ON -DBOAT_MAVLINK_INCLUDE_DIR="$GITHUB_WORKSPACE/mavlink_headers"
      - name: Compile all
        run: cmake --build build-mavlink --parallel 2
      - name: Decode test and regression tests
        run: ctest --test-dir build-mavlink --output-on-failure

  rover-sitl:
    name: Real Rover SITL transport smoke (no-GNSS)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Checkout MAVLink C headers
        uses: actions/checkout@v4
        with:
          repository: mavlink/c_library_v2
          path: mavlink_headers
          persist-credentials: false
      - name: Build C++ bridge
        run: |
          cmake -S . -B build-mavlink -DCMAKE_BUILD_TYPE=Release -DBOAT_WITH_MAVLINK=ON -DBOAT_MAVLINK_INCLUDE_DIR="$GITHUB_WORKSPACE/mavlink_headers"
          cmake --build build-mavlink --parallel 2
          ctest --test-dir build-mavlink --output-on-failure
      - name: Install telemetry auditor (test-only Python dependency)
        run: python3 -m pip install --disable-pip-version-check --user "pymavlink>=2.4,<2.5"
      - name: Download official prebuilt ArduRover SITL binary
        run: |
          mkdir -p sitl-smoke-output
          curl -fL --retry 3 --connect-timeout 20 https://firmware.ardupilot.org/Rover/latest/SITL_x86_64_linux_gnu/ardurover -o sitl-smoke-output/ardurover
          curl -fL --retry 3 --connect-timeout 20 https://firmware.ardupilot.org/Rover/latest/SITL_x86_64_linux_gnu/git-version.txt -o sitl-smoke-output/ardurover-git-version.txt
          chmod +x sitl-smoke-output/ardurover
      - name: Run official Rover SITL with external-navigation fixture
        run: bash tools/sitl/run_sitl_smoke.sh
      - name: Upload ArduRover logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boat-ardurover-sitl-smoke
          path: |
            sitl-smoke-output/*.log
            sitl-smoke-output/parameters.json
            sitl-smoke-output/origin_result.json
            sitl-smoke-output/ekf_observations.json
            sitl-smoke-output/mission_protocol.json
            sitl-smoke-output/ardurover-git-version.txt
          retention-days: 30
